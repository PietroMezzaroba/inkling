; Inkling — firmware for the Xteink X3 built on the FreeInk SDK.
;
; One ESP32-C3 binary. It carries the X3 profile only: the X4 shares the MCU but
; is not a target of this project.
;
;   pio run -e x3                 build
;   pio run -e x3 -t upload       flash over USB
;   pio device monitor            serial log

[platformio]
default_envs = x3
build_cache_dir = .cache
extra_configs = platformio.local.ini

[base]
; Same pioarduino platform the SDK is verified against (Arduino 3.3.x / IDF 5.5.x).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; OTA layout shared with the stock and CrossPoint firmware, so either can be
; flashed back without repartitioning.
board_build.partitions = partitions.csv

build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Single framebuffer: the panel controller's RAM keeps the previous frame.
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -DUSE_UTF8_LONG_NAMES=1
  ; FreeInkBook working sets sized for a PSRAM-less MCU (same as the simulator).
  -DFREEINK_BOOK_SMALL=1
  ; InklingCore diagnostics into the device log (src/common/DeviceLog.cpp).
  -include $PROJECT_DIR/src/common/CoreLogHook.h
  ; Code shared by the reader and the updater.
  -I $PROJECT_DIR/src/common
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

extra_scripts = pre:scripts/version.py

lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  Imu=symlink://freeink-sdk/libs/hardware/Imu
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  FreeInkBook=symlink://freeink-sdk/libs/book/FreeInkBook


; Heap reclamation. On the ESP32-C3, code placed in IRAM and all static data
; share one ~320 KB SRAM pool, and the heap gets what is left: the reader's
; arenas plus the 52 KB framebuffer only fit once IRAM code moves to flash.
; Based on CrossPoint's measured C3 profile (MIT). The first build rebuilds the
; Arduino core libraries (slow once, cached afterwards).
custom_sdkconfig =
  ; Task stacks right-sized from CrossPoint's high-water measurements.
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  CONFIG_ESP_IPC_TASK_STACK_SIZE=1024
  ; Wi-Fi hot paths out of IRAM: slower transfers, used only for updates.
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
  CONFIG_ESP_WIFI_GCMP_SUPPORT=n
  ; NOT here on purpose: CONFIG_FREERTOS_PLACE_FUNCTIONS_INTO_FLASH,
  ; CONFIG_RINGBUF_PLACE_FUNCTIONS_INTO_FLASH, CONFIG_HEAP_PLACE_FUNCTION_INTO_FLASH.
  ; With them the first device boot panicked: IRAM interrupt handlers (USB
  ; serial, timers) call into those functions, which are unreachable while the
  ; flash cache is off during flash reads/writes.
  ; The X3 bootloader rolls back unconfirmed images; with this the app side
  ; agrees: OTA installs are marked "new" and the app confirms itself
  ; (firmware::markValid) once it has drawn a screen.
  CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y
  ; ROM libc routines instead of IRAM copies.
  CONFIG_LIBC_OPTIMIZED_MISALIGNED_ACCESS=n
  ; Drop unused cloud wrappers from the core rebuild.
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n
  ; Keep defaults the stock Arduino build sets for bundled components.
  CONFIG_BT_NIMBLE_CRYPTO_STACK_MBEDTLS=y
  CONFIG_BT_NIMBLE_EXT_SCAN=y
  CONFIG_ESP_RMAKER_WORK_QUEUE_TASK_STACK=4096
  CONFIG_FMB_MASTER_MAX_API_BLOCKING_TIME_MS=10000
  CONFIG_FMB_MASTER_TIMEOUT_MS_RESPOND=3000
  CONFIG_FMB_QUEUE_LENGTH=20
  CONFIG_FMB_TCP_CONNECTION_TOUT_SEC=20

; Cloud components the core rebuild cannot build (missing server certs) and
; this firmware never uses.
custom_component_remove =
  espressif/esp_insights
  espressif/esp_rainmaker
  espressif/esp_diagnostics
  espressif/esp_diag_data_store
  espressif/esp_schedule
  espressif/esp_rcp_update
  espressif/esp_secure_cert_mgr
  espressif/cbor

; The reader: library, books, (later) the pet. No Wi-Fi, so it keeps the RAM.
[env:x3]
extends = base
build_src_filter = +<common/> +<reader/>
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X3=1
  -DINKLING_SERIAL_LOG=1
; Reading faces (SIL OFL 1.1, see assets/fonts/OFL.txt), mapped from flash.
board_build.embed_files =
  assets/fonts/Alegreya-Regular.ttf
  assets/fonts/Alegreya-Italic.ttf

; The updater: lives in the other app slot and installs new reader builds over
; Wi-Fi (scripts/ota.sh). No reader, so the Wi-Fi stack has the heap.
[env:x3-updater]
extends = base
build_src_filter = +<common/> +<updater/>
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X3=1
  -DINKLING_SERIAL_LOG=1
