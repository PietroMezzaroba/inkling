; Inkling — firmware for the Xteink X3 built on the FreeInk SDK.
;
; One ESP32-C3 binary. It carries the X3 profile only: the X4 shares the MCU but
; is not a target of this project.
;
;   pio run -e x3                 build
;   pio run -e x3 -t upload       flash over USB
;   pio device monitor            serial log

[platformio]
default_envs = x3
build_cache_dir = .cache
extra_configs = platformio.local.ini

[base]
; Same pioarduino platform the SDK is verified against (Arduino 3.3.x / IDF 5.5.x).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; OTA layout shared with the stock and CrossPoint firmware, so either can be
; flashed back without repartitioning.
board_build.partitions = partitions.csv

build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Single framebuffer: the panel controller's RAM keeps the previous frame.
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -DUSE_UTF8_LONG_NAMES=1
  ; FreeInkBook working sets sized for a PSRAM-less MCU (same as the simulator).
  -DFREEINK_BOOK_SMALL=1
  ; InklingCore diagnostics into the device log (src/common/DeviceLog.cpp).
  -include $PROJECT_DIR/src/common/CoreLogHook.h
  ; Code shared by the reader and the updater.
  -I $PROJECT_DIR/src/common
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

extra_scripts = pre:scripts/version.py

lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  Imu=symlink://freeink-sdk/libs/hardware/Imu
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  FreeInkBook=symlink://freeink-sdk/libs/book/FreeInkBook


; No custom_sdkconfig: rebuilding the Arduino core libraries with a tuned
; sdkconfig produced images that never reached setup() on the device (twice,
; root cause unknown), while the stock libraries boot fine. Stock libraries
; until that is understood; the memory budget is handled in code instead
; (reader arenas sized from the free heap at boot).

; The reader: library, books, (later) the pet. No Wi-Fi, so it keeps the RAM.
[env:x3]
extends = base
build_src_filter = +<common/> +<reader/>
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X3=1
  -DINKLING_SERIAL_LOG=1
; Reading faces (SIL OFL 1.1, see assets/fonts/OFL.txt), mapped from flash.
board_build.embed_files =
  assets/fonts/Alegreya-Regular.ttf
  assets/fonts/Alegreya-Italic.ttf

; The updater: lives in the other app slot and installs new reader builds over
; Wi-Fi (scripts/ota.sh). No reader, so the Wi-Fi stack has the heap.
[env:x3-updater]
extends = base
build_src_filter = +<common/> +<updater/>
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X3=1
  -DINKLING_SERIAL_LOG=1

; One-shot diagnostics: copies the crash core dump and boot-slot data to the
; SD card, then returns to the other slot. Built exactly like phase 0 (stock
; Arduino libraries from build/arduino-libs-orig, no custom sdkconfig), the
; last configuration known to boot on the device.
[env:x3-rescue]
extends = base
build_src_filter = +<rescue/>
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X3=1
  -DINKLING_SERIAL_LOG=1
